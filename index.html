<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B2622">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Cafe">
<title>Word Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 모바일은 한 열(캐릭터 말풍선이 위), 900px 이상은 시험 카드 + 오른쪽 캐릭터 */
:root{
  color-scheme:light;
  --bg:#FAF9F5; --surface:#FFFFFF; --surface2:#F4F1EA; --line:#E6E1D6; --line2:#CFC8BA;
  --fg:#141413; --muted:#5F594F;
  --green:#2F6B45; --green-ink:#2F6B45; --on-green:#FFFFFF; --green-bg:#E4F1E8;
  --wrong-ink:#A9482A; --wrong-bg:#FBE4DA; --wrong-soft:#FBF1EC; --tag:#A9482A; --on-tag:#FFFFFF;
  --clay:#D97757; --eye:#141413; --bar:#2B2622; --bar-fg:#FAF9F5; --bar-chip:#3B342E;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1816; --surface:#252220; --surface2:#2E2A26; --line:#3A3530; --line2:#544D45;
  --fg:#F1EDE4; --muted:#B3AC9F;
  --green:#5FA774; --green-ink:#8FC49A; --on-green:#0F1A13; --green-bg:#1F3A28;
  --wrong-ink:#F0997B; --wrong-bg:#3B2620; --wrong-soft:#2E2420;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1816; --surface:#252220; --surface2:#2E2A26; --line:#3A3530; --line2:#544D45;
  --fg:#F1EDE4; --muted:#B3AC9F;
  --green:#5FA774; --green-ink:#8FC49A; --on-green:#0F1A13; --green-bg:#1F3A28;
  --wrong-ink:#F0997B; --wrong-bg:#3B2620; --wrong-soft:#2E2420;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans);-webkit-text-size-adjust:100%;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--green-ink);outline-offset:2px}
h1,h2{text-wrap:balance;margin:0}
p{margin:0}

.bar{padding-top:env(safe-area-inset-top,0px);background:var(--bar);color:var(--bar-fg);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1080px;margin:0 auto;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--bar-chip);border-radius:999px;padding:5px 14px;font-size:14px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#8FC49A}

.page{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.grid{max-width:1080px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.coach{order:-1;display:flex;align-items:center;gap:12px}
.coach svg{width:104px;height:auto;flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.6}
.bubble b{display:block;font-size:12px;color:var(--green-ink);letter-spacing:.04em}
.bubble::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.mascot{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}*{scroll-behavior:auto!important}}
@media (min-width:900px){
  .grid{grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
  .coach{order:0;flex-direction:column;align-items:stretch;gap:18px;position:sticky;top:20px}
  .coach svg{width:220px;align-self:center}
  .bubble{flex:none}
  .bubble::after{left:50%;right:auto;top:auto;bottom:-7px;transform:translateX(-50%) rotate(45deg);border-top:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:20px}
@media (min-width:640px){.card{padding:36px 36px 32px}}
.eyebrow{font-size:13px;font-weight:700;color:var(--green-ink);letter-spacing:.08em}
.title{font-family:var(--serif);font-size:clamp(30px,6vw,46px);line-height:1.15;font-weight:600}
.lead{color:var(--muted);font-size:16px;line-height:1.7;max-width:560px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{border-radius:14px;padding:14px 16px;background:var(--surface2)}
.stat.w{background:var(--wrong-soft)}
.stat small{display:block;font-size:13px;color:var(--muted)}
.stat strong{font-family:var(--serif);font-size:34px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:15px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:11px 14px;border-radius:12px;background:var(--wrong-soft)}
.row.ok{background:var(--green-bg)}
.row .en{font-family:var(--serif);font-size:21px;font-weight:600;overflow-wrap:anywhere}
.row .ko{color:var(--muted);font-size:15px}
.tag{font-size:12px;font-weight:700;color:var(--on-tag);background:var(--tag);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag.ok{background:var(--green);color:var(--on-green)}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.warn{color:var(--wrong-ink);font-weight:500;font-size:15px}

.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{min-height:52px;padding:0 28px;border-radius:12px;border:0;font-weight:700;font-size:16px;background:var(--green);color:var(--on-green)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{background:var(--line2);color:var(--muted)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line2)}
.btn.link{background:transparent;color:var(--wrong-ink);min-height:44px;padding:0 8px}
.btn.sm{min-height:48px;padding:0 22px;font-size:15px}
.btn.hint{background:transparent;color:var(--green-ink);border:1.5px solid var(--green-ink);min-height:48px;padding:0 18px;font-size:15px}
.btn.hint:disabled{color:var(--muted);border-color:var(--line2)}

.prog{display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-top b{color:var(--fg)}
.track{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:999px;transition:width .25s ease}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--muted)}
.q-en{font-family:var(--serif);font-size:clamp(42px,12vw,60px);line-height:1.1;font-weight:600;overflow-wrap:anywhere}
.q-ko{font-size:clamp(24px,6vw,32px);line-height:1.4;font-weight:700;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:60px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line2);font-size:17px;line-height:1.4;overflow-wrap:anywhere}
.opt.en{font-family:var(--serif);font-size:22px;font-weight:600}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 13px var(--sans);background:var(--surface2)}
.opt:hover:not(:disabled){border-color:var(--green-ink)}
.opt.right{background:var(--green-bg);border:2px solid var(--green-ink)}
.opt.bad{background:var(--wrong-bg);border:2px solid var(--wrong-ink)}
.opt.dim{color:var(--muted);border-color:var(--line)}
.opt.gone{background:var(--surface2);border-style:dashed;color:var(--muted);text-decoration:line-through}
.mark{font-size:13px;font-weight:700;margin-left:auto;flex:none}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.score{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.score b{font-family:var(--serif);font-size:72px;line-height:1;font-weight:600}
.score span{font-size:26px;color:var(--muted)}
h2.sec{font-size:17px}
label.lbl{font-size:14px;font-weight:700}
textarea{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.7;background:var(--surface);resize:vertical;min-height:260px}
.msg{font-size:15px;font-weight:500}
.msg.ok{color:var(--green-ink)}.msg.no{color:var(--wrong-ink)}
.sets{display:flex;flex-direction:column;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.segb{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);font-size:15px;font-weight:500}
.segb[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:700}
.ex{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:var(--surface2);font-family:var(--serif);font-size:19px;line-height:1.55;overflow-wrap:anywhere}
.exl{display:inline-block;margin-right:10px;font:700 12px var(--sans);letter-spacing:.06em;color:var(--green-ink)}
.timer{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted);margin-top:4px}
.timer b{font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums}
.timer.low,.timer.low b{color:var(--wrong-ink)}
.fill.t{background:var(--clay);transition:none}
.sub{color:var(--muted);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chart{position:relative;width:100%}
.chart svg{display:block;touch-action:pan-y;max-width:100%}
.tip{position:absolute;transform:translateX(-50%);pointer-events:none;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.45;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.14);z-index:2}
.tip b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.tip span{display:block;color:var(--muted)}
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:500}
.tbl tr.none td{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>

<script src="lib.js"></script>
<script>
const OLD_SAMPLE = [
  'abandon, 버리다, 포기하다','ambiguous, 모호한, 애매한','benefit, 이익, 혜택','contract, 계약(서)',
  'deny, 부인하다, 거부하다','efficient, 효율적인','fluctuate, 변동하다, 오르내리다',
  'genuine, 진짜의, 진심의','hesitate, 망설이다, 주저하다','inevitable, 피할 수 없는'
].join('\n');
const SAMPLE = [
  'abandon, 버리다, 포기하다 | He had to abandon his plan.',
  'ambiguous, 모호한, 애매한 | The answer was ambiguous.',
  'benefit, 이익, 혜택 | Reading has many benefits.',
  'contract, 계약(서) | She signed the contract today.',
  'deny, 부인하다, 거부하다 | He denied breaking the window.',
  'efficient, 효율적인 | This is an efficient way to study.',
  'fluctuate, 변동하다, 오르내리다 | Prices fluctuate every week.',
  'genuine, 진짜의, 진심의 | It is a genuine leather bag.',
  'hesitate, 망설이다, 주저하다 | Do not hesitate to ask.',
  'inevitable, 피할 수 없는 | Change is inevitable.'
].join('\n');
const KEYS = ['A','B','C','D'];
const EYES = {
  normal:['M64 50h12v28h-12zM124 50h12v28h-12z',''],
  happy:['','M60 72L70 56L80 72M120 72L130 56L140 72'],
  sad:['M64 62h12v16h-12zM124 62h12v16h-12z',''],
  think:['M72 50h12v28h-12zM132 50h12v28h-12z','']
};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){storageFailed=true}}
};
let storageFailed=false;
store.set('wc_probe','1'); // 저장이 막힌 브라우저(사생활 보호 모드 등)를 미리 알아챈다
function saveWarn(){return storageFailed?'<p class="note" style="color:var(--wrong-ink);font-weight:500">이 브라우저에서는 단어장과 기록이 저장되지 않아요. 사생활 보호 모드이거나 저장 공간이 막혀 있을 수 있어요. 창을 닫으면 사라져요.</p>':''}
const { parse, blankWord, buildQuiz, autoNext, timedOut, dayKey, recordAnswer, sanitizeLog, buckets, totals, trend, niceMax } = WC;
const AUTO_MS = 5000; // 정답 후 자동으로 넘어가기까지
let autoId = 0;
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadWrong(){try{const a=JSON.parse(store.get('wc_wrong','[]'));return Array.isArray(a)?a:[]}catch(e){return[]}}

const saved0 = store.get('wc_words', SAMPLE);
const text0 = saved0 === OLD_SAMPLE ? SAMPLE : saved0; // 예문 없는 옛 예시는 새 예시로 교체
function loadCfg(){
  try{const c=JSON.parse(store.get('wc_cfg','{}'));return {count:[10,30,50].indexOf(c.count)>=0?c.count:10,sec:[0,10,20,30,60].indexOf(c.sec)>=0?c.sec:0}}catch(e){return{count:10,sec:0}}
}
function loadLog(){try{return sanitizeLog(JSON.parse(store.get('wc_log','{}')))}catch(e){return{}}}
const UNITS=[['day','하루','하루 단위 · 최근 14일'],['week','일주일','일주일 단위 · 최근 8주'],['month','한 달','한 달 단위 · 최근 6개월']];
const s = {log:loadLog(),unit:'day',screen:'start',text:text0,draft:text0,wrong:loadWrong(),words:[],quiz:[],qi:0,picked:-1,score:0,hint:false,missed:[],fixed:[],cfg:loadCfg(),deadline:0};
let timerId = 0;
const TIMEOUT = 99; // 시간 초과는 어떤 보기와도 겹치지 않는 값으로 기록한다
const app = document.getElementById('app');

function mascot(mood){
  const e=EYES[mood]||EYES.normal;
  return '<svg class="mascot" viewBox="0 0 200 160" role="img" aria-label="클로드 캐릭터">'
   +'<ellipse cx="100" cy="148" rx="70" ry="7" fill="currentColor" opacity=".10"/>'
   +'<g fill="var(--clay)"><rect x="12" y="62" width="20" height="26"/><rect x="168" y="62" width="20" height="26"/><rect x="30" y="26" width="140" height="86"/>'
   +'<rect x="44" y="112" width="14" height="30"/><rect x="72" y="112" width="14" height="30"/><rect x="114" y="112" width="14" height="30"/><rect x="142" y="112" width="14" height="30"/></g>'
   +(e[0]?'<path d="'+e[0]+'" fill="var(--eye)"/>':'')
   +(e[1]?'<path d="'+e[1]+'" stroke="var(--eye)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>':'')
   +'</svg>';
}
const SPARK=(()=>{let l='';for(let i=0;i<12;i++)l+='<line x1="14" y1="'+(i%2?4:1.5)+'" x2="14" y2="9" transform="rotate('+(i*30)+' 14 14)"/>';
  return '<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><g stroke="#D97757" stroke-width="3" stroke-linecap="round">'+l+'</g></svg>'})();

function cur(){
  const q=s.quiz[s.qi]; if(!q) return null;
  return {q,word:s.words[q.wi],answered:s.picked>=0,en2ko:q.dir==='en2ko'};
}
function savedWrongList(){
  const known=Object.create(null);parse(s.text).forEach(w=>{known[w.w.toLowerCase()]=w});
  return s.wrong.filter(k=>known[k]).map(k=>known[k]);
}
function coach(parsedLen,draftLen){
  const c=cur();let text,mood='normal';
  if(s.screen==='start'){
    const n=savedWrongList().length;
    text=parsedLen<4?'단어장에 단어를 4개 이상 넣어 주세요. 같이 외워 봐요.':n?'틀렸던 단어 '+n+'개가 기다리고 있어요. 이번엔 꼭 잡아 봐요.':'어서 와요. 오늘도 같이 외워 봐요.';
  }else if(s.screen==='edit'){
    text=draftLen>=4?'좋아요. 단어 '+draftLen+'개를 읽었어요.':'한 줄에 "단어, 뜻" 하나씩 적어 주세요.';
  }else if(s.screen==='stats'){
    const tr=trend(buckets(s.log,s.unit,new Date()));
    if(!tr)text='기록이 쌓이면 오답률이 어떻게 변하는지 보여 드릴게요.';
    else if(tr.diff<-0.5){mood='happy';text='오답률이 '+Math.round(-tr.diff)+'%p 줄었어요. 잘하고 있어요!'}
    else if(tr.diff>0.5)text='오답률이 조금 올랐어요. 틀렸던 단어를 다시 풀어 봐요.';
    else text='꾸준히 같은 실력을 유지하고 있어요.';
  }else if(s.screen==='result'){
    const r=s.score/s.quiz.length;
    if(r>=0.9){mood='happy';text='거의 완벽해요! 오늘 공부 제대로 했네요.'}
    else if(r>=0.6)text='좋아요. 틀린 단어는 저장해 뒀으니 다음에 다시 만나요.';
    else{mood='sad';text='괜찮아요, 틀린 단어는 제가 기억해 둘게요. 한 번 더 해 봐요.'}
  }else if(!c.answered){
    if(s.hint){mood='think';text='오답 두 개를 지워 줬어요. 이제 둘 중에 골라 봐요.'}
    else text=c.q.wasWrong?'이 단어, 전에 틀렸던 거예요. 이번엔 맞혀 봐요.':'천천히 생각해 봐요. 막히면 힌트를 눌러요.';
  }else if(s.picked===TIMEOUT){
    mood='sad';text='시간이 다 됐어요. '+c.word.w+' = '+c.word.ko+'. 저장해 둘게요, 다음 시험에 또 나와요.';
  }else if(s.picked===c.q.cpos){
    mood='happy';text=c.q.wasWrong?'틀렸던 단어를 맞혔어요! 이제 복습 목록에서 빠져요.':'정답이에요! '+c.word.w+' = '+c.word.ko;
  }else{
    mood='sad';text=c.word.w+' = '+c.word.ko+'. 저장해 둘게요, 다음 시험에 또 나와요.';
  }
  return {text,mood};
}

function seg(label,key,vals,fmt){

function quizView(){
  const c=cur(),q=c.q,total=s.quiz.length,hidden={};
  if(s.hint&&!c.answered){let n=0;q.opts.forEach((o,k)=>{if(k!==q.cpos&&n<2){hidden[k]=1;n++}})}
  const opts=q.opts.map((wi,k)=>{
    const w=s.words[wi],label=c.en2ko?w.ko:w.w;
    let cls='opt'+(c.en2ko?'':' en'),mark='';
    if(c.answered&&k===q.cpos){cls+=' right';mark='<span class="mark" style="color:var(--green-ink)">정답</span>'}

  }).join('');

    +'<div class="track"><div id="tfill" class="fill t" style="width:'+rem/(sec*1000)*100+'%"></div></div>':'';

  return '<div style="display:flex;flex-direction:column;gap:16px">'

   +'<div class="card"><div><div class="qhead"><span>'+(c.en2ko?'이 단어의 뜻은?':'이 뜻에 맞는 영어 단어는?')+'</span>'
   +(q.wasWrong?'<span class="tag" style="font-size:13px;padding:3px 12px">틀렸던 단어</span>':'')+'</div>'
   +'<div class="'+(c.en2ko?'q-en':'q-ko')+'" style="margin-top:8px">'+esc(c.en2ko?c.word.w:c.word.ko)+'</div>'
   +(exText?'<p class="ex"><span class="exl">예문</span>'+esc(exText)+'</p>':'')+'</div>'
   +'<div class="opts">'+opts+'</div>'
   +'<div class="actions"><button class="btn hint" data-act="hint"'+(s.hint||c.answered?' disabled':'')+'>'+(s.hint?'힌트 사용함':'힌트 (오답 2개 지우기)')+'</button>'
   +(c.answered?'<button id="next" class="btn sm" data-act="next">'+nextLabel()+'</button>':'')+'</div></div></div>';

function statsView(){
  const bs=buckets(s.log,s.unit,new Date()),tot=totals(bs),tr=trend(bs);
  const cap=UNITS.filter(u=>u[0]===s.unit)[0][2];
  const tabs='<div class="seg" role="group" aria-label="보는 단위">'+UNITS.map(u=>'<button class="segb" data-act="unit" data-val="'+u[0]+'" aria-pressed="'+(s.unit===u[0])+'">'+u[1]+'</button>').join('')+'</div>';
  let body;

    body='<p class="note">이 기간에는 푼 문제가 없어요. 시험을 풀면 오답률이 여기에 쌓여요.</p>';

    const rows=bs.slice().reverse().map(b=>'<tr'+(b.n?'':' class="none"')+'><td>'+b.long+'</td><td>'+(b.n?b.n:'—')+'</td><td>'+(b.n?b.w:'—')+'</td><td>'+(b.n?Math.round(b.rate)+'%':'—')+'</td></tr>').join('');
    body='<div class="stats"><div class="stat w"><small>이 기간 오답률</small><strong>'+Math.round(tot.rate)+'</strong> <span>%</span><div class="sub">'+tot.n+'문제 중 '+tot.w+'개 틀림</div></div>'
      +'<div class="stat"><small>직전 기록 대비</small>'+trendHtml+'</div></div>'
      +'<div><h2 class="sec">오답률 변화</h2><p class="sub">낮을수록 잘하고 있는 거예요. 그래프를 누르거나 올려 보면 값이 나와요.</p></div>'
      +'<div class="chart" id="chart"></div>'

   +'<div class="btns"><button class="btn" data-act="home">처음 화면</button></div></div>';

let rzId=0;
function drawChart(){
  const host=document.getElementById('chart');if(!host)return;
  const bs=buckets(s.log,s.unit,new Date()),n=bs.length,max=niceMax(bs);
  const W=Math.max(280,host.clientWidth),H=W<480?240:280,L=40,R=16,T=30,B=30,pw=W-L-R,ph=H-T-B;
  const X=i=>L+pw*(n===1?0.5:i/(n-1)),Y=r=>T+ph*(1-r/max);
  let g='',p='',last=-1,prev=-1,run='';
  for(let k=0;k<=4;k++){const v=max*k/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+Math.round(v)+'%</text>'}
  // 안 푼 날은 건너뛰고 푼 날끼리 선으로 잇는다(점은 실제로 푼 날에만 찍힌다).
  bs.forEach((b,i)=>{
    if(b.rate==null)return;
    run+=(run?'L':'M')+X(i).toFixed(1)+' '+Y(b.rate).toFixed(1);prev=last;last=i;
  });
  if(run)p+='<path d="'+run+'" fill="none" stroke="var(--wrong-ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const step=Math.max(1,Math.ceil(44/(pw/Math.max(n-1,1))));
  let dots='',xl='';
  bs.forEach((b,i)=>{
    if(b.rate!=null)dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(b.rate).toFixed(1)+'" r="'+(i===last?5:4.5)+'" fill="var(--wrong-ink)" stroke="var(--surface)" stroke-width="2"/>';
    if((n-1-i)%step===0)xl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+b.label+'</text>';
  });
  let end='';
  if(last>=0){const ex=X(last),ey=Y(bs[last].rate);
    // 직전 점이 위에서 내려오면 라벨은 아래, 아니면 위에 둬서 선과 겹치지 않게 한다
    const below=prev>=0&&Y(bs[prev].rate)<ey&&ey+22<=T+ph;
    end='<text x="'+ex.toFixed(1)+'" y="'+(below?ey+22:ey-12).toFixed(1)+'" text-anchor="'+(ex>W-30?'end':'middle')+'" font-size="14" font-weight="700" fill="var(--fg)">'+Math.round(bs[last].rate)+'%</text>'}
  host.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="오답률 변화 그래프. 자세한 값은 아래 표에 있어요.">'
    +g+'<line id="xh" x1="0" x2="0" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--line2)" stroke-width="1" visibility="hidden"/>'+p+dots+end
    +'<circle id="hl" r="8" fill="none" stroke="var(--wrong-ink)" stroke-width="2" visibility="hidden"/>'+xl+'</svg>';
  const tip=document.createElement('div');tip.className='tip';tip.hidden=true;
  const tv=document.createElement('b'),tl=document.createElement('span'),tn=document.createElement('span');
  tip.append(tv,tl,tn);host.append(tip);
  const svg=host.firstChild,xh=svg.querySelector('#xh'),hl=svg.querySelector('#hl');
  function show(e){
    const r=svg.getBoundingClientRect();
    const px=(e.clientX-r.left)*(W/r.width); // CSS로 줄어든 경우에도 그림 좌표로 환산
    const i=Math.min(n-1,Math.max(0,Math.round((px-L)/(pw/Math.max(n-1,1)))));
    const b=bs[i],x=X(i);
    xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');
    tv.textContent=b.n?Math.round(b.rate)+'%':'기록 없음';
    tl.textContent=b.long;tn.textContent=b.n?'푼 문제 '+b.n+'개 · 틀린 문제 '+b.w+'개':'';
    tip.hidden=false;
    let ty=T;
    if(b.rate!=null){const y=Y(b.rate);hl.setAttribute('cx',x);hl.setAttribute('cy',y);hl.setAttribute('visibility','visible');
      ty=y<T+ph/2?y+16:y-tip.offsetHeight-16}else hl.setAttribute('visibility','hidden');
    tip.style.top=Math.max(0,ty)+'px';
    tip.style.left=Math.min(W-tip.offsetWidth/2,Math.max(tip.offsetWidth/2,x))+'px';
  }
  function hide(){xh.setAttribute('visibility','hidden');hl.setAttribute('visibility','hidden');tip.hidden=true}
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);
  svg.addEventListener('pointerleave',hide);svg.addEventListener('pointercancel',hide);
}
window.addEventListener('resize',()=>{if(s.screen==='stats'){cancelAnimationFrame(rzId);rzId=requestAnimationFrame(drawChart)}});

function render(){
  const parsed=parse(s.text),draftLen=parse(s.draft).length,c=coach(parsed.length,draftLen);
  const chip=s.screen==='quiz'||s.screen==='result'?'정답 '+s.score+'개':s.screen==='stats'?'내 기록':'단어 '+parsed.length+'개';
  const main=s.screen==='start'?startView(parsed):s.screen==='edit'?editView():s.screen==='quiz'?quizView():s.screen==='stats'?statsView():resultView();
  app.innerHTML='<header class="bar"><div class="bar-in"><div class="brand">'+SPARK+'<span>Word Cafe</span></div><span class="chip"><span class="dot"></span>'+chip+'</span></div></header>'
   +'<main class="page"><div class="grid"><section>'+main+'</section>'
   +'<aside class="coach"><div class="bubble" aria-live="polite"><b>클로드</b><span id="coach-text">'+esc(c.text)+'</span></div>'+mascot(c.mood)+'</aside></div></main>';
  if(s.screen==='edit')updateDraft(true);
  if(s.screen==='stats')drawChart();
  if(s.screen==='quiz'&&s.picked>=0){const n=document.getElementById('next');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'})}
}
function updateDraft(fromRender){
  const ta=document.getElementById('words-input');if(!ta)return;
  if(!fromRender)s.draft=ta.value;
  const n=parse(s.draft).length,ok=n>=4;
  const m=document.getElementById('draft-msg');
  m.textContent=ok?'단어 '+n+'개를 읽었어요.':'읽은 단어가 '+n+'개예요. 4개 이상 필요해요.';
  m.className='msg '+(ok?'ok':'no');
  document.getElementById('save').disabled=!ok;
  const t=document.getElementById('coach-text');
  if(t)t.textContent=ok?'좋아요. 단어 '+n+'개를 읽었어요.':'한 줄에 "단어, 뜻" 하나씩 적어 주세요.';
}

function autoLeft(){return autoId?Math.max(0,s.autoAt-Date.now()):0}
function nextLabel(){
  const base=s.qi>=s.quiz.length-1?'결과 보기':'다음 문제';
  return autoId?base+' ('+Math.ceil(autoLeft()/1000)+')':base;
}
function stopAuto(){clearInterval(autoId);autoId=0}
function startAuto(){
  stopAuto();
  s.autoAt=Date.now()+AUTO_MS;
  autoId=setInterval(()=>{
    if(autoLeft()<=0){next();return}
    const b=document.getElementById('next');if(b)b.textContent=nextLabel();
  },250);
}
function stopTimer(){clearInterval(timerId);timerId=0}
function startTimer(){
  stopTimer();
  if(s.screen!=='quiz'||!s.cfg.sec||s.picked>=0)return;
  s.deadline=Date.now()+s.cfg.sec*1000;
  render();
  timerId=setInterval(tick,250);
}
function tick(){
  const rem=Math.max(0,s.deadline-Date.now()),el=document.getElementById('tleft');
  if(el){
    el.textContent=Math.ceil(rem/1000)+'초';
    document.getElementById('tfill').style.width=rem/(s.cfg.sec*1000)*100+'%';
    el.parentNode.classList.toggle('low',rem<=5000);
  }
  if(rem<=0)pick(TIMEOUT);
}

function start(){
  const words=parse(s.text);if(words.length<4)return;
  stopAuto();
  const quiz=buildQuiz(words,s.wrong,s.cfg.count);
  Object.assign(s,{screen:'quiz',words,quiz,qi:0,picked:-1,score:0,hint:false,missed:[],fixed:[]});
  render();window.scrollTo(0,0);startTimer();
}
function pick(k){
  if(s.picked>=0)return;
  if(timedOut(s.cfg.sec,s.deadline,Date.now()))k=TIMEOUT; // 마감 뒤에 들어온 클릭은 시간 초과
  stopTimer();s.left=Math.max(0,s.deadline-Date.now());
  const q=s.quiz[s.qi],key=s.words[q.wi].w.toLowerCase(),ok=k===q.cpos;
  let wrong=s.wrong;
  if(!ok&&wrong.indexOf(key)<0)wrong=wrong.concat([key]);
  if(ok&&q.wasWrong)wrong=wrong.filter(x=>x!==key);
  store.set('wc_wrong',JSON.stringify(wrong));
  recordAnswer(s.log,dayKey(new Date()),!ok);store.set('wc_log',JSON.stringify(s.log));
  s.wrong=wrong;s.picked=k;
  if(ok)s.score++;else s.missed.push(q.wi);
  if(ok&&q.wasWrong)s.fixed.push(q.wi);
  if(autoNext(k,q.cpos))startAuto();
  render();
}
function next(){
  stopAuto();
  if(s.qi>=s.quiz.length-1){s.screen='result';s.hint=false}
  else{s.qi++;s.picked=-1;s.hint=false}
  render();window.scrollTo(0,0);startTimer();
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='start')start();
  else if(a==='pick')pick(+b.dataset.k);
  else if(a==='stats'){s.screen='stats';render();window.scrollTo(0,0)}
  else if(a==='unit'){s.unit=b.dataset.val;render()}
  else if(a==='cfg'){s.cfg[b.dataset.key]=+b.dataset.val;store.set('wc_cfg',JSON.stringify(s.cfg));render()}
  else if(a==='hint'){s.hint=true;render()}
  else if(a==='next')next();
  else if(a==='home'||a==='cancel'){s.screen='start';render();window.scrollTo(0,0)}
  else if(a==='edit'){s.screen='edit';s.draft=s.text;render();window.scrollTo(0,0)}
  else if(a==='save'){s.text=s.draft;store.set('wc_words',s.text);s.screen='start';render();window.scrollTo(0,0)}
  else if(a==='clearwrong'){s.wrong=[];store.set('wc_wrong','[]');b.textContent='비웠어요'}
  else if(a==='copy'){
    const ta=document.getElementById('words-input');
    const done=()=>{b.textContent='복사했어요'};
    try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select()})}catch(err){ta.select()}
  }
});
app.addEventListener('input',e=>{if(e.target.id==='words-input')updateDraft(false)});
render();
</script>
</body>
</html>
